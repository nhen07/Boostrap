<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .menu {
            float: left;
            width: 20%;
            text-align: center;
        }

        .menu a {
            background-color:rgb(210, 208, 208);
            padding: 8px 10px;
            margin-top: 7px;
            display: block;
            width: 100%;
            color: black;
        }

        .main {
            float: left;
            width: 60%;
            padding: 0 20px;
        }

        .right {
            background-color:rgb(210, 208, 208);
            float: left;
            width: 20%;
            padding: 15px;
            margin-top: 7px;
            text-align: center;
        }

        @media only screen and (max-width: 620px) {
            .menu, .main, .right {
                width: 100%;
            }
        }

        .phandau {
            text-align: center;
            background-color: rgb(210, 208, 208);
            padding: 30px 10px;
        }

        .footer {
            background-color: rgb(210, 208, 208);
            text-align: center;
            float: inline-start;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phandau">
            <h1>Hello World</h1>
        </div>

        <div class="menu">
            <a href="#">Link 1</a>
            <a href="#">Link 2</a>
            <a href="#">Link 3</a>
            <a href="#">Link 4</a>
        </div>

        <div class="main">
            <h2>Lorum Ipsum</h2>
            <p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nomummy nibh euismod tincidunt ut laoreet dolare magna aliquam erat volutpat.</p>
        </div>

        <div class="right">
            <h3>About</h3>
            <p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit</p>
        </div>
    </div>

    <div class="footer">
        <h4>Coppy right web3school.com</h4>
    </div>

</body>
</html>
